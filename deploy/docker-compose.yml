# Local development stack: PostgreSQL + relay, plain HTTP on 127.0.0.1 only.
# NOT a production deployment: production needs TLS (a reverse proxy or RELAY_TLS_CERT_FILE/KEY_FILE),
# a real secret store and backups. See docs/relay.md.
#
#   cp deploy/.env.example deploy/.env      # then edit the values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: relay
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20

  relay:
    build: ../relay
    depends_on:
      db:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD}@db:5432/relay?sslmode=disable
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?set RELAY_ADMIN_TOKEN (32+ characters) in deploy/.env}
      RELAY_PUBLIC_ORIGIN: ws://localhost:8443
      RELAY_LISTEN_ADDR: :8443
      RELAY_ALLOW_INSECURE_HTTP: "true"
    ports:
      - "127.0.0.1:8443:8443"

volumes:
  dbdata:
