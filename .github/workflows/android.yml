name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Unit tests, lint, assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version script test
        working-directory: .
        run: scripts/test-next-version.sh
      - name: Unit tests (core, capabilities)
        run: ./gradlew --no-daemon :core:test :capabilities:test
      - name: Lint and assemble debug APK
        run: ./gradlew --no-daemon lintDebug assembleDebug
      - name: Assemble release (unsigned; checks the release config builds)
        run: ./gradlew --no-daemon :app:assembleRelease -PversionName=0.0.0-ci -PversionCode=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/

  instrumented:
    name: Instrumentation tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          working-directory: android
          script: ./gradlew --no-daemon :authentication:connectedDebugAndroidTest :runtime:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-reports-api${{ matrix.api }}
          path: android/**/build/reports/androidTests/
