name: Release

# Actions -> Release -> Run workflow, pick patch / minor / major.
# Works out the next version from the latest vX.Y.Z tag, builds a signed APK and publishes it as a GitHub
# release (which also creates the tag). The private app store picks it up from there.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: "Optional: what changed (GitHub's auto-generated notes are added below)"
        required: false

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_DISPATCH_TOKEN: ${{ secrets.STORE_DISPATCH_TOKEN }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the main branch."
          exit 1

      - name: Require signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets first. See docs/distribution.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest version

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          NEXT="$(scripts/next-version.sh "$BUMP")"
          read -r VERSION CODE <<<"$NEXT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (versionCode $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :core:test :capabilities:test

      - name: Build signed APK
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/androvia-${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub release (creates the tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true

      # Optional: refresh the store's release index now instead of waiting up to 15 minutes.
      - name: Tell the store about the release
        if: env.STORE_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.STORE_DISPATCH_TOKEN }}
        run: gh api repos/aman-dhakar-191/private-app-store/dispatches -f event_type=app-released

      - name: Summary
        run: |
          echo "## Released v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
